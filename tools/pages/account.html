<!--TITLE: Account | BIOMOMMIE-->
<!--DESC: Sign in or create your BIOMOMMIE account.-->
<main class="simple-page">
  <div class="container">
    <div class="auth-card reveal is-visible">
      <div class="auth-tabs">
        <div class="auth-tab is-active" data-tab="signin">Sign In</div>
        <div class="auth-tab" data-tab="register">Create Account</div>
      </div>

      <form id="signinForm" data-fake-submit="Account sign-in is coming soon — thank you for your patience.">
        <div class="form-group"><label>Email Address</label><input type="email" required></div>
        <div class="form-group"><label>Password</label><input type="password" required></div>
        <button type="submit" class="btn btn-dark btn-block">Sign In</button>
        <p class="text-muted text-center" style="margin-top:18px;font-size:.85rem">Forgot your password?</p>
      </form>

      <form id="registerForm" data-fake-submit="Account creation is coming soon — thank you for your patience." hidden>
        <div class="form-group"><label>Full Name</label><input type="text" required></div>
        <div class="form-group"><label>Email Address</label><input type="email" required></div>
        <div class="form-group"><label>Password</label><input type="password" required></div>
        <button type="submit" class="btn btn-dark btn-block">Create Account</button>
      </form>
    </div>
  </div>
</main>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const tabs = document.querySelectorAll('.auth-tab');
  const signin = document.getElementById('signinForm');
  const register = document.getElementById('registerForm');
  tabs.forEach(tab => tab.addEventListener('click', () => {
    tabs.forEach(t => t.classList.remove('is-active'));
    tab.classList.add('is-active');
    const isSignin = tab.dataset.tab === 'signin';
    signin.hidden = !isSignin;
    register.hidden = isSignin;
  }));
});
</script>
