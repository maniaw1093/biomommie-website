<!--TITLE: Track Order | BIOMOMMIE-->
<!--DESC: Track your BIOMOMMIE order.-->
<main class="simple-page">
  <div class="container">
    <div class="auth-card reveal is-visible">
      <span class="eyebrow">Track Order</span>
      <h1 style="margin:16px 0 10px;font-size:1.8rem">Where's my order?</h1>
      <p class="text-muted" style="margin-bottom:26px;font-size:.92rem">Enter your order number and email, and we'll get back to you with the latest status.</p>
      <form data-fake-submit="Thanks — we'll email your order status shortly.">
        <div class="form-group"><label>Order Number</label><input type="text" required placeholder="e.g. BM10234"></div>
        <div class="form-group"><label>Email Address</label><input type="email" required></div>
        <button type="submit" class="btn btn-dark btn-block">Track Order</button>
      </form>
      <p class="text-muted text-center" style="margin-top:20px;font-size:.85rem">You'll also receive a tracking link by email and SMS as soon as your order ships.</p>
    </div>
  </div>
</main>
